[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-cli"
version = "0.1.0"
description = "Keyboard-first Telegram client for Windows Terminal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=8.0.0",
    "telethon>=1.40.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",   # Gemini transcription
    "qrcode>=7.4",     # QR login
    "PySocks>=1.7.1",  # SOCKS and HTTP proxies
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
tg-cli = "tg_cli.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
